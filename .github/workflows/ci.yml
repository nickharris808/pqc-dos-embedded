name: ci
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

jobs:
  qemu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install cross toolchain and qemu
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi qemu-system-arm
      - name: build
        run: ./build.sh
      - name: run both scenarios
        run: ./run.sh both
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pytest==8.3.3
      - run: pytest -q

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck build.sh run.sh
